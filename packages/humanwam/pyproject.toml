[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanwam"
version = "0.2.0"
description = "Explicit multi-policy training and inference orchestration for HumanWAM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "omegaconf>=2.3,<2.4"]

[project.scripts]
humanwam = "humanwam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
