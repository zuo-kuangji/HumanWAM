name: HumanWAM policy contracts

on:
  push:
    paths:
      - "packages/humanwam/**"
      - "configs/humanwam/**"
      - "configs/wholebody/**"
      - "scripts/wholebody/**"
      - "scripts/humanwam/**"
      - "src/imagewam/wholebody*.py"
      - "src/imagewam/joint_reference*.py"
      - "src/imagewam/augmentation_config.py"
      - "src/imagewam/trainer.py"
      - "src/imagewam/datasets/wholebody*.py"
      - "src/imagewam/datasets/proprio_augmentation.py"
      - "tests/test_wholebody*.py"
      - "tests/test_augmentation_config.py"
      - "tests/test_joint_reference_contract.py"
      - "patches/**"
      - "backends.lock.json"
      - ".gitmodules"
      - "third_party/ODE-POLICY"
      - "third_party/Isaac-GR00T-ODE"
      - ".github/workflows/policies.yml"
  pull_request:
    paths:
      - "packages/humanwam/**"
      - "configs/humanwam/**"
      - "configs/wholebody/**"
      - "scripts/wholebody/**"
      - "scripts/humanwam/**"
      - "src/imagewam/wholebody*.py"
      - "src/imagewam/joint_reference*.py"
      - "src/imagewam/augmentation_config.py"
      - "src/imagewam/trainer.py"
      - "src/imagewam/datasets/wholebody*.py"
      - "src/imagewam/datasets/proprio_augmentation.py"
      - "tests/test_wholebody*.py"
      - "tests/test_augmentation_config.py"
      - "tests/test_joint_reference_contract.py"
      - "patches/**"
      - "backends.lock.json"
      - ".gitmodules"
      - "third_party/ODE-POLICY"
      - "third_party/Isaac-GR00T-ODE"
      - ".github/workflows/policies.yml"

permissions:
  contents: read

jobs:
  lightweight-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch pinned sources used by CPU compatibility checks
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: >-
          git submodule update --init --depth 1 --filter=blob:none
          third_party/GR00T-WholeBodyControl third_party/FastWAM third_party/Isaac-GR00T
          third_party/ODE-POLICY third_party/Isaac-GR00T-ODE
      - name: Install orchestration and test dependencies
        run: python -m pip install -e './packages/humanwam[test,data]' omegaconf==2.3.0
      - name: CPU policy and orchestration contracts
        env:
          PYTHONPATH: src
          CUDA_VISIBLE_DEVICES: ""
        run: >-
          python -m pytest -q packages/humanwam/tests
          tests/test_wholebody_training_cli.py tests/test_wholebody_joint_v2_cli.py
          tests/test_joint_reference_contract.py
          tests/test_augmentation_config.py
          tests/test_wholebody_cli.py
      - name: Lightweight package lint
        run: python -m ruff check packages/humanwam

  ode-native-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Fetch pinned ODE G1 source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: >-
          git submodule update --init --depth 1 --filter=blob:none
          third_party/ODE-POLICY third_party/Isaac-GR00T-ODE third_party/Isaac-GR00T
      - name: Install CPU-only test runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './packages/humanwam[test,data]' 'numpy>=1.26,<2' safetensors
          python -m pip install --no-deps -e third_party/ODE-POLICY/groot
      - name: Native ODE optimizer, exact resume, manifests and issued-prefix carry
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q third_party/ODE-POLICY/groot/tests packages/humanwam/tests/test_groot_ode.py
