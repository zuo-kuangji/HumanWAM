name: HumanWAM policy contracts

on:
  push:
    paths:
      - "packages/humanwam/**"
      - "configs/humanwam/**"
      - "configs/wholebody/**"
      - "scripts/wholebody/**"
      - "scripts/humanwam/**"
      - "src/imagewam/wholebody*.py"
      - "src/imagewam/joint_reference*.py"
      - "src/imagewam/datasets/wholebody_joint_reference.py"
      - "tests/test_wholebody*.py"
      - "tests/test_joint_reference_contract.py"
      - "patches/**"
      - "backends.lock.json"
      - ".gitmodules"
      - ".github/workflows/policies.yml"
  pull_request:
    paths:
      - "packages/humanwam/**"
      - "configs/humanwam/**"
      - "configs/wholebody/**"
      - "scripts/wholebody/**"
      - "scripts/humanwam/**"
      - "src/imagewam/wholebody*.py"
      - "src/imagewam/joint_reference*.py"
      - "src/imagewam/datasets/wholebody_joint_reference.py"
      - "tests/test_wholebody*.py"
      - "tests/test_joint_reference_contract.py"
      - "patches/**"
      - "backends.lock.json"
      - ".gitmodules"
      - ".github/workflows/policies.yml"

permissions:
  contents: read

jobs:
  lightweight-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch pinned sources used by CPU compatibility checks
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: >-
          git submodule update --init --depth 1 --filter=blob:none
          third_party/GR00T-WholeBodyControl third_party/FastWAM
      - name: Install orchestration and test dependencies
        run: python -m pip install -e './packages/humanwam[test]' omegaconf==2.3.0
      - name: CPU policy and orchestration contracts
        env:
          PYTHONPATH: src
          CUDA_VISIBLE_DEVICES: ""
        run: >-
          python -m pytest -q packages/humanwam/tests
          tests/test_wholebody_training_cli.py tests/test_wholebody_joint_v2_cli.py
          tests/test_joint_reference_contract.py
      - name: Lightweight package lint
        run: python -m ruff check packages/humanwam
