_target_: imagewam.runtime.create_imagewam_flux2_klein

flux2_src_path: /apdcephfs_nj7/share_305204761/alixzhang/flux2
flux2_model_path: ???
ae_model_path: ???
variant: klein-base-4b
qwen3_model_spec: Qwen/Qwen3-4B
qwen_context_len: 512
load_text_encoder: false
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
pack_proprio_after_text: true
flux2_action_image_context:
  mode: prefix_only
action_dit_pretrained_path: null
# Optional A2A identity prior: zero only the final action velocity projection
# after loading the pretrained action backbone. All modulation weights stay intact.
zero_init_action_head: false
# Optional soft identity prior for A2A. A value below 1 scales only the final
# action velocity projection after pretrained weights are loaded. Keep this at
# 1.0 when zero_init_action_head=true.
action_head_init_scale: 1.0

flux2_lora_config:
  enabled: false
  rank: 16
  alpha: 16.0
  dropout: 0.0
  save_lora_merged: false
  save_trainable_only: false
  target_suffixes:
    - qkv
    - proj
    - linear1
    - linear2
    - img_mlp.0
    - img_mlp.2
    - txt_mlp.0
    - txt_mlp.2

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  num_heads: 24
  attn_head_dim: 128
  num_layers_double: 5
  num_layers_single: 20
  mlp_ratio: 4.0
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.5
  lambda_action: 1.0
  action_a2a:
    enabled: false
    fm_weight: 1.0
    ic_weight: 0.0
    ic_steps: 0
    ic_loss: l1
    source_noise_std: 0.0
    aura:
      enabled: false
      router_hidden_dim: 256
      router_pool_tokens: 8
      diversity_weight: 0.0
      noise_dims: []
      adaptive_inference: false
      max_inference_steps: 5
      adaptive_execution: false
      min_execution_steps: 2
      max_execution_steps: 8
  image_i2i:
    enabled: false
    source_mode: current
    current_residual_scale: 0.0
    variance_normalize: false
    ic_weight: 0.0
    ic_steps: 0
    ic_loss: l1
    source_noise_std: 0.0
