# Training only. Inference keeps deterministic resize and raw current state.
schema: wholebody_training_augmentation_v3
enabled: true
seed: 42
visual:
  enabled: true
  probability: 0.5
  camera_mode: independent
  exposure:
    probability: 0.35
    gain: [0.85, 1.25]
    gamma: [0.85, 1.15]
  overexposure:
    probability: 0.12
    gain: [1.25, 1.8]
  color:
    probability: 0.7
    contrast: [0.85, 1.15]
    saturation: [0.8, 1.2]
    hue: 0.013888888888888888  # +/- 5 degrees, expressed as hue-circle turns
  jitter:
    probability: 0.4
    translation: 0.04
    rotation_degrees: 3.0
    scale: [0.96, 1.04]
  blur:
    probability: 0.12
    sigma: [0.4, 1.2]
    kernel_size: 9
  pixel_noise:
    probability: 0.25
    std: [0.01568627450980392, 0.03137254901960784]  # 4/255 to 8/255 RGB scale
  jpeg:
    probability: 0.25
    quality: [50, 80]
proprio:
  enabled: true
  noise_probability: 0.25
  body_noise_std: 0.01
  body_bias_std: 0.0
  hand_noise_std: 0.005
  hand_bias_std: 0.0
  gravity_rotation_std_deg: 0.0
  state_dropout:
    probability: 0.1
