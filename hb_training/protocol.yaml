      dp: {global_batch: 512, note: "only the batch is enforced"}
    save_rule: interface.save_rule.small_models
    record: "config.json: task, dataset_id (--dataset-id REPO@COMMIT or inferred from <name>-<commit>/data), save_steps, environment (python, torch, torchvision, numpy, pillow, cuda, cudnn, gpu, driver), augmentation_sha256, inloop code sha256, protocol_deviations / protocol_exceptions, continuation; each checkpoint's protocol.json carries the same summary; complete.json at the end"
    order_and_resume: "from e4809ea9: EpochSampler order default_rng([seed, 1, epoch]); each item augmented with default_rng([aug_seed, draw]) (its position in the run's stream: independent of num_workers); train_state.pt keeps torch / cuda / numpy / python random states, --resume is bit-exact (CPU test)"
    env_snapshot: "envs/hb-baselines.txt (A800 / NAS env, python 3.12.12, pillow 13.0.0; = Humanoid_benchmark evaluation/baselines/requirements.lock.txt)"
    seed: 0                      # config.json training.seed of every published folder (verified 2026-11-24)
    seed_source: "hb_baselines config.json training.seed"
    recipe_record: "config.json in each HF folder (training, augmentation, dataset episodes, code_commit)"
