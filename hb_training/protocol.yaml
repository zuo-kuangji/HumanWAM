# Humanoid Benchmark canonical training protocol (machine-readable companion of REPRODUCIBILITY.md).
# Verified 2026-11-23 against the artifacts of the runs actually trained (training_args.bin / train_args.txt /
# out/config.yaml / published protocol.json). check_protocol.py reads this file. Change a value only together with
# REPRODUCIBILITY.md and only on an explicit user decision; record deviations under `exceptions`.
version: 2026-11-28
seed_rule: "one training seed per model, kept on every training (user 2026-11-27); 42 for new models and FM-DiT v1/v2; runs on another seed are kept and recorded, not retrained"

interface:                       # identical for every model
  proprio:
    g1: {dim: 44, layout: "29 body joint angles + measured hands 6+6 + projected gravity 3", velocity: false}
    h2: {dim: 78, layout: "75 joints (body 31 incl. head, Sharpa hands 22+22) + projected gravity 3", velocity: false}
  action:
    g1: {dim: 76, layout: "motion token 64 + same-frame measured hands 12"}
    h2: {dim: 75}
    h2p: {dim: 82, layout: "body 31 + hands 44 + SONIC planner 7 (A14)"}
  cameras: {g1: [ego_view, chest], h2: [head, chest]}
  fps: 30
  augmentation:
    spec: "Humanoid Benchmark online augmentation spec v2 (2026-11-09), see project CLAUDE.md / docs/augmentation_v2.md"
    implementation: hb_groot/hb_aug_v2.py
    implementation_sha256_prefix: 9f7713cea4f846ef
    visual: "15 effects, one effect per sample boosted to 1.5x; model-native image augmentation off"
    proprio: "per-joint bias U(+-2 deg) + N(0, 0.25 deg) clipped at 3 sigma (hb_aug_v2.perturb_joints); no delay, no history drop"
    eval: "all random perturbation off"
    rng: "numpy Generator from (HB_AUG_SEED = training seed, torch.initial_seed() of the process / DataLoader worker, global rank, worker id); FastWAM adds sample index + per-process call counter"
    rng_since: "2026-11-23 13:05 UTC for GR00T, Psi-Zero, FastWAM (training log prints HB_AUG_SEED=<seed>); pi0.5, DiT4DiT, Delta Flow were always seeded"
  gradient_accumulation_steps: 1
  inloop_mse: {every: 250, batch: 8, seed: 1234, split: "heldout if the task has never-trained episodes else train10"}
  continuation: {init: weights_only, peak_lr_factor: 0.3, warmup_ratio: 0.05, schedule: cosine, steps: 2000, steps_long_task: 4000,
                 impl: {fastwam: fastwam_tools/hb_fastwam_cont.py, hb_baselines: "evaluation/baselines/train.py --init-from <run>/checkpoints/step-N (Humanoid_benchmark bai c926770a; other lr / warm-up / steps need --continuation-exception)"}}
  save_rule:                     # user 2026-11-27; applies to trainings started from then on (running and finished ones keep theirs)
    small_models: {models: [act, flash, fm_dit, fm_dit_v2, dp, ode_mlp, ode_dit], rule: "6 checkpoints spread evenly over the run's max steps: k x steps / 6, k = 1..6 (hb_baselines rounds to the 250-step in-loop grid; the last is the end)", examples: {30000: [5000, 10000, 15000, 20000, 25000, 30000], 12000: [2000, 4000, 6000, 8000, 10000, 12000], 4000: [750, 1250, 2000, 2750, 3250, 4000]}}
    large_models: {models: [groot, psi0, fastwam, deltaflow, pi05, dit4dit], rule: "the final checkpoint + at most one intermediate at ~80 % of the total steps", examples: {4000: [3200, 4000], 8000: [6400, 8000], fastwam_cont2k: [5600, 6000]}}
  long_task_step_factor: {c6: 2}          # A14 is NOT doubled
  step_rule:                     # user 2026-11-28; replaces "large models 4000 / FastWAM 4000 + 2000" and the C6 doubling for trainings not yet started
    rule: "steps = ceil to 1000 of (model base steps x mean frames per episode of the training data / 544.33); 544.33 = A20 basket v2 (@c4df4d40) frames per episode"
    base_steps: {groot: 4000, psi0: 4000, fastwam: 6000, fm_dit: 58000, flash: 12000, ode_mlp: 5000, act: 4000}
    fm_dit_base_history: "30000 until 2026-11-28; user 2026-11-28: 58000, from the collaborator's A17 FM-DiT v1 run that converged at 80000 steps on 751.84 frames per episode (80000 x 544.33 / 751.84 = 57919)"
    fm_dit_v1_targets_20261128: {a3v4p: 30000, a7v4p: 26000, a10v3: 91000, basketv2: 58000, b8: 66000, b5c: 46000, b6v7: 64000, b7gv3: 81000, b7bv2: 80000, a17cr4: 54000, a18cr4: 52000, c6v2: 221000}
    fm_dit_v1_plan_20261128: "user 2026-11-28: finished FM-DiT v1 runs are continued to the target (--init-from, peak lr 1e-4 = the from-scratch peak, warm-up 500; exception below); runs still training are first evaluated on 20 plain runs and continued only with no success; tasks of the plan not trained yet are also continued from their existing checkpoints (user 2026-11-28 correction; sources pending), only a task with no checkpoint at all (b7gv3) trains from scratch; a3v4p / a7v4p already reach it (no top-up); a14cr5 / a17cr4 / a18cr4 not topped up or trained (user 2026-11-28: the collaborator trained FM-DiT v1 80000 steps on A14, A17 and A18; the a17 / a18 continuations started 10:41Z were stopped at about 30100); a10v3 is also trained"

models:
  groot:
    seed: 42                     # upstream gr00t/configs/data/data_config.py; HF TrainingArguments.seed
    seed_source: "upstream Isaac-GR00T default"
    global_batch: 512
    layout: {nodes: 2, gpus_per_node: 8, per_gpu_batch: 32}
    layout_h2p: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 8000
    learning_rate: 1.0e-4
    warmup_ratio: 0.05
    lr_schedule: cosine
    weight_decay: 1.0e-5
    save_steps: [2000, 2500, 3000, 3500, 4000]   # runs started before 2026-11-27
    save_steps_new: {g1: [3200, 4000], c6: [6400, 8000]}   # interface.save_rule.large_models (user 2026-11-27)
    trainable: "full fine-tune: tune_llm, tune_visual, projector, diffusion action head, VLLN"
    action_horizon: 16
    dataloader_num_workers: 8
    upstream: {repo: third_party/Isaac-GR00T, commit: 7aa0bca}
    env: {name: groot-py312, python: 3.12.12, torch: 2.9.0+cu128}
    launchers: {g1: hb_groot/groot_pair2x32.sh, h2: hb_groot/groot_pair2x32_h2.sh, h2p: hb_groot/groot_quad16_h2p.sh}
    launchers_new: {g1: hb_groot/groot_pair2x32_r80.sh, h2: hb_groot/groot_pair2x32_h2_r80.sh, h2p: hb_groot/groot_quad16_h2p_r80.sh, relay_item: hb_groot/gp_r80_mix.sh}   # save_steps_new: save_steps 3200, save_total_limit 2; HF Trainer 4.57 always saves the last step
  psi0:
    seed: 292285                 # upstream Psi0 finetune scripts (scripts/train/psi0/*.sh --seed=292285)
    seed_source: "upstream Psi0 official finetune scripts"
    bias_seed: 292285
    global_batch: 512
    layout: {nodes: 2, gpus_per_node: 8, per_gpu_batch: 32}
    layout_h2p: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 4000           # exception: not doubled (user 2026-11-13)
    learning_rate: 1.0e-4
    param_group_lr: {lang_backbone: 1.0e-6, vision_tower: 1.0e-5, mm_projector: 1.0e-4}
    warmup_ratio: 0.025
    lr_schedule: cosine
    weight_decay: 1.0e-6
    betas: [0.95, 0.999]
    max_grad_norm: 1.0
    mixed_precision: bf16
    save_every: 2000             # runs started before 2026-11-27
    save_steps_new: [3200, 4000]   # interface.save_rule.large_models (user 2026-11-27)
    hb_delay_prob: 0.0
    action_horizon: 30
    num_workers: 8
    upstream: {repo: third_party/Psi0, commit: cda3fdf}
    env: {name: psi0, python: 3.11.18, torch: 2.7.0+cu126}
    launchers: {all: hb_b512/psi0_multi.sh}
    launchers_new: {all: hb_b512/psi0_multi.sh, env: {HB_CKPT_SAVE: 3200}}   # save_steps_new: hb_psi0/hb_args.py checkpointing_steps 3200; psi should_save_training_checkpoint always saves the last step
  fastwam:
    seed: 42                     # upstream FastWAM configs/train.yaml
    seed_source: "upstream FastWAM default"
    global_batch: 512
    layout: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 8000
    continuation_steps: 2000     # total 6000; C6 4000 more (total 12000)
    learning_rate: 1.0e-4
    continuation_learning_rate: 3.0e-5
    lr_schedule: cosine
    weight_decay: 0.01
    max_grad_norm: 1.0
    mixed_precision: bf16
    save_every: 2000             # runs started before 2026-11-27
    continuation_save_every: 1000
    save_steps_new: {main: [3200, 4000], continuation: [5600, 6000]}   # interface.save_rule.large_models (user 2026-11-27)
    action_horizon: 16
    video: "17-frame clips, two cameras side by side 224x448"
    num_workers: 8
    upstream: {repo: "github.com/yuantianyuan01/FastWAM", commit: 7faa71108368fbb3b6885649f112af607427a2d4}
    env: {name: fastwam, python: 3.11.18, torch: 2.7.1+cu128}
    launchers: {train: hb_fastwam/fastwam_task.sh, cont: hb_fastwam/fastwam_cont.sh, cont_c6: hb_fastwam/fastwam_cont4k.sh}
    launchers_new: {train: hb_fastwam/fastwam_task_r80.sh, cont: hb_fastwam/fastwam_cont_r80.sh}   # save_steps_new: save_every 3200 / 1600; the FastWAM trainer always saves max_steps
  pi05:
    seed: 42                     # openpi TrainConfig.seed; HB_AUG_SEED default 42
    global_batch: 256
    max_steps: 4000
    save_steps: [2000, 4000]
    action_horizon: 16
    inloop_mse: false            # MUST be wired before the next pi0.5 training
    upstream: {repo: third_party/openpi, commit: 215abfb}
  dit4dit:
    seed: 42                     # hb_dit4dit/hb_d4d_config.py; HB_AUG_SEED default 42
    global_batch: 64
    max_steps: 8000
    save_steps: [6000, 8000]
    learning_rate: {backbone_interface: 1.0e-5, action_model: 1.0e-4, base: 3.0e-5, min_lr: 5.0e-7, schedule: cosine_with_min_lr}
    warmup_ratio: 0.05
    proprio_encoding: "sin/cos of joint angles (G1 73 / H2 153), native recipe"
    inloop_mse: false            # MUST be wired before the next DiT4DiT training
    upstream: {repo: third_party/DiT4DiT, commit: 66a6f3a}
  deltaflow:
    seed: 42                     # deltaflow-runs/<task>/run/production.yaml
    aug_seeds: {image: 20261110, proprio: 20261106}
    global_batch: 256
    layout: {gpus: 32, per_gpu_batch: 8}
    max_steps: 8000
    max_steps_c6: 16000
    warmup_ratio: 0.05
    lr_schedule: cosine
    save_steps: [6000, 8000]
  act:
    seed: 292285                 # hb_act/hb_act_args.py (Psi0 repo's LeRobot ACT; HF act/<task>/epoch-NNN)
    retired: "2026-11-24 user: never train ACT with hb_training/hb_act again; every ACT training uses hb_baselines (models.hb_baselines)"
    global_batch: 256
    max_steps: 4000
  hb_baselines:                  # collaborator's stack: HF act/<task>/b512*, fm-dit, dp (protocol format hb_baselines/1)
    models: [act, fm_dit, dp]
    enforced_by: "Humanoid_benchmark bai e4809ea9 evaluation/baselines/train.py PROTOCOL_RECIPES: batch / steps (long tasks x2) / warm-up / workers / seed default to the recipes below; another value, --save-every or a non-30-Hz dataset is refused unless --protocol-exception; the in-training MSE is required for every model; a dirty evaluation/ tree is refused unless --allow-dirty-tree"
    recipes:                     # moved here from models.flash.act (2026-11-27); flash, fm_dit_v2, ode_mlp: their own entries
      act: {global_batch: 512, layout: {nodes: 1, gpus_per_node: 1, per_gpu_batch: 512}, max_steps: 4000, lr: 1.0e-4, betas: [0.95, 0.999], weight_decay: 1.0e-6, warmup_steps: 200, lr_schedule: cosine, backbone_lr_scale: 0.1, ema: 0.9999, amp: true, num_workers: 32, prefetch_factor: 2, seed: 0}
      fm_dit: {global_batch: 512, seed: 42, note: "v1 (DextraVerse port); seed 42 for every training from 2026-11-27 (user: one seed per model; published seed-0 folders stay as recorded); only batch and seed are enforced"}
      fm_dit_trim3f_runs:          # 2026-11-28 upload (hb训练部署): FM-DiT v1, seed 42, batch 512, 30000 steps, saves and published [5000, 10000, 15000, 20000, 25000, 30000] (user 2026-11-27: plain 50 on each, keep the best), fm-dit @ad16a001
        - {task: a3v4p, code: d2096858, hf: fm-dit/a3-fridge-open-v4/b512-trim3f, inloop_nmse_30000: 0.0753}
        - {task: a7v4p, code: d2096858, hf: fm-dit/a7-cabinet-close-v4/b512-trim3f, inloop_nmse_30000: 0.0976}
        - {task: b1v2p, code: 36ded31d, hf: fm-dit/b1-riceball-microwave/b512-trim3f, inloop_nmse_30000: 0.1314}
        - {task: a14cr5, code: d2096858, hf: fm-dit/a14-unscrew-bulb/b512-trim3f, inloop_nmse_30000: 0.1099}
