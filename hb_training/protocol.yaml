# Humanoid Benchmark canonical training protocol (machine-readable companion of REPRODUCIBILITY.md).
# Verified 2026-11-23 against the artifacts of the runs actually trained (training_args.bin / train_args.txt /
# out/config.yaml / published protocol.json). check_protocol.py reads this file. Change a value only together with
# REPRODUCIBILITY.md and only on an explicit user decision; record deviations under `exceptions`.
version: 2026-11-23

interface:                       # identical for every model
  proprio:
    g1: {dim: 44, layout: "29 body joint angles + measured hands 6+6 + projected gravity 3", velocity: false}
    h2: {dim: 78, layout: "75 joints (body 31 incl. head, Sharpa hands 22+22) + projected gravity 3", velocity: false}
  action:
    g1: {dim: 76, layout: "motion token 64 + same-frame measured hands 12"}
    h2: {dim: 75}
    h2p: {dim: 82, layout: "body 31 + hands 44 + SONIC planner 7 (A14)"}
  cameras: {g1: [ego_view, chest], h2: [head, chest]}
  fps: 30
  augmentation:
    spec: "Humanoid Benchmark online augmentation spec v2 (2026-11-09), see project CLAUDE.md / docs/augmentation_v2.md"
    implementation: hb_groot/hb_aug_v2.py
    implementation_sha256_prefix: 9f7713cea4f846ef
    visual: "15 effects, one effect per sample boosted to 1.5x; model-native image augmentation off"
    proprio: "per-joint bias U(+-2 deg) + N(0, 0.25 deg) clipped at 3 sigma (hb_aug_v2.perturb_joints); no delay, no history drop"
    eval: "all random perturbation off"
    rng: "numpy Generator from (HB_AUG_SEED = training seed, torch.initial_seed() of the process / DataLoader worker, global rank, worker id); FastWAM adds sample index + per-process call counter"
    rng_since: "2026-11-23 13:05 UTC for GR00T, Psi-Zero, FastWAM (training log prints HB_AUG_SEED=<seed>); pi0.5, DiT4DiT, Delta Flow were always seeded"
  gradient_accumulation_steps: 1
  inloop_mse: {every: 250, batch: 8, seed: 1234, split: "heldout if the task has never-trained episodes else train10"}
  continuation: {init: weights_only, peak_lr_factor: 0.3, warmup_ratio: 0.05, schedule: cosine, steps: 2000, steps_long_task: 4000}
  long_task_step_factor: {c6: 2}          # A14 is NOT doubled

models:
  groot:
    seed: 42                     # upstream gr00t/configs/data/data_config.py; HF TrainingArguments.seed
    seed_source: "upstream Isaac-GR00T default"
    global_batch: 512
    layout: {nodes: 2, gpus_per_node: 8, per_gpu_batch: 32}
    layout_h2p: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 8000
    learning_rate: 1.0e-4
    warmup_ratio: 0.05
    lr_schedule: cosine
    weight_decay: 1.0e-5
    save_steps: [2000, 2500, 3000, 3500, 4000]
    trainable: "full fine-tune: tune_llm, tune_visual, projector, diffusion action head, VLLN"
    action_horizon: 16
    dataloader_num_workers: 8
    upstream: {repo: third_party/Isaac-GR00T, commit: 7aa0bca}
    env: {name: groot-py312, python: 3.12.12, torch: 2.9.0+cu128}
    launchers: {g1: hb_groot/groot_pair2x32.sh, h2: hb_groot/groot_pair2x32_h2.sh, h2p: hb_groot/groot_quad16_h2p.sh}
  psi0:
    seed: 292285                 # upstream Psi0 finetune scripts (scripts/train/psi0/*.sh --seed=292285)
    seed_source: "upstream Psi0 official finetune scripts"
    bias_seed: 292285
    global_batch: 512
    layout: {nodes: 2, gpus_per_node: 8, per_gpu_batch: 32}
    layout_h2p: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 4000           # exception: not doubled (user 2026-11-13)
    learning_rate: 1.0e-4
    param_group_lr: {lang_backbone: 1.0e-6, vision_tower: 1.0e-5, mm_projector: 1.0e-4}
    warmup_ratio: 0.025
    lr_schedule: cosine
    weight_decay: 1.0e-6
    betas: [0.95, 0.999]
    max_grad_norm: 1.0
    mixed_precision: bf16
    save_every: 2000
    hb_delay_prob: 0.0
    action_horizon: 30
    num_workers: 8
    upstream: {repo: third_party/Psi0, commit: cda3fdf}
    env: {name: psi0, python: 3.11.18, torch: 2.7.0+cu126}
    launchers: {all: hb_b512/psi0_multi.sh}
  fastwam:
    seed: 42                     # upstream FastWAM configs/train.yaml
    seed_source: "upstream FastWAM default"
    global_batch: 512
    layout: {nodes: 4, gpus_per_node: 8, per_gpu_batch: 16}
    max_steps: 4000
    max_steps_c6: 8000
    continuation_steps: 2000     # total 6000; C6 4000 more (total 12000)
    learning_rate: 1.0e-4
    continuation_learning_rate: 3.0e-5
    lr_schedule: cosine
    weight_decay: 0.01
    max_grad_norm: 1.0
    mixed_precision: bf16
    save_every: 2000
    continuation_save_every: 1000
    action_horizon: 16
    video: "17-frame clips, two cameras side by side 224x448"
    num_workers: 8
    upstream: {repo: "github.com/yuantianyuan01/FastWAM", commit: 7faa71108368fbb3b6885649f112af607427a2d4}
    env: {name: fastwam, python: 3.11.18, torch: 2.7.1+cu128}
    launchers: {train: hb_fastwam/fastwam_task.sh, cont: hb_fastwam/fastwam_cont.sh, cont_c6: hb_fastwam/fastwam_cont4k.sh}
  pi05:
    seed: 42                     # openpi TrainConfig.seed; HB_AUG_SEED default 42
    global_batch: 256
    max_steps: 4000
    save_steps: [2000, 4000]
    action_horizon: 16
    inloop_mse: false            # MUST be wired before the next pi0.5 training
    upstream: {repo: third_party/openpi, commit: 215abfb}
  dit4dit:
    seed: 42                     # hb_dit4dit/hb_d4d_config.py; HB_AUG_SEED default 42
    global_batch: 64
    max_steps: 8000
    save_steps: [6000, 8000]
    learning_rate: {backbone_interface: 1.0e-5, action_model: 1.0e-4, base: 3.0e-5, min_lr: 5.0e-7, schedule: cosine_with_min_lr}
    warmup_ratio: 0.05
    proprio_encoding: "sin/cos of joint angles (G1 73 / H2 153), native recipe"
    inloop_mse: false            # MUST be wired before the next DiT4DiT training
    upstream: {repo: third_party/DiT4DiT, commit: 66a6f3a}
  deltaflow:
    seed: 42                     # deltaflow-runs/<task>/run/production.yaml
    aug_seeds: {image: 20261110, proprio: 20261106}
    global_batch: 256
    layout: {gpus: 32, per_gpu_batch: 8}
    max_steps: 8000
    max_steps_c6: 16000
    warmup_ratio: 0.05
    lr_schedule: cosine
    save_steps: [6000, 8000]
  act:
    seed: 292285                 # hb_act/hb_act_args.py (Psi0 repo's LeRobot ACT; HF act/<task>/epoch-NNN)
    retired: "2026-11-24 user: never train ACT with hb_training/hb_act again; every ACT training uses hb_baselines (models.hb_baselines)"
    global_batch: 256
    max_steps: 4000
  hb_baselines:                  # collaborator's stack: HF act/<task>/b512*, fm-dit, dp (protocol format hb_baselines/1)
    models: [act, fm_dit, dp]
    seed: 0                      # config.json training.seed of every published folder (verified 2026-11-24)
    seed_source: "hb_baselines config.json training.seed"
    recipe_record: "config.json in each HF folder (training, augmentation, dataset episodes, code_commit)"
    code: {repo: "github.com/zuo-kuangji/Humanoid_benchmark", entry: "evaluation/baselines/train.py --policy act|fm_dit|dp --contract <contract>", augmentation: evaluation/augmentation/hb_aug_v2.py, env: "evaluation/baselines/requirements.txt (python 3.12, torch 2.9.0+cu128)", commits_published: [4385573e, 028df1bb]}
    only_act_code: true          # 2026-11-24 user: the only ACT used in this project
    inloop_mse: available        # evaluation/baselines/inloop.py --inloop-task (Humanoid_benchmark bai 9cca6255); wire it for the next ACT training
  flash:                         # user's own method (NeurIPS 2026), joined 2026-11-24, B6 first; registered from the FLASH session's measurements
    seed: 42                     # upstream FLASH-Policy roboverse_learn/il/configs/train_config/default_train.yaml training_params.seed
    seed_source: "upstream NTUMARS/FLASH-Policy default_train.yaml training_params.seed"
    aug_rng: "per DataLoader worker numpy default_rng([HB_AUG_SEED=42, torch.initial_seed(), worker id]); log prints HB_AUG_SEED=42"
    upstream: {repo: "github.com/NTUMARS/FLASH-Policy", commit: f47e490, license: Apache-2.0}
    code: {repo: "github.com/zuo-kuangji/Humanoid_benchmark", branch: bai, commit: 9cca6255, entry: "evaluation/baselines/train.py --policy flash --contract g1_sonic_dfx6", model: evaluation/baselines/flash.py, parity: "check_flash_parity.py: 12 checks, max abs diff 0"}
    env: {name: hb-baselines, python: "3.12.1", torch: "2.9.0+cu128", torchvision: "0.24.0"}
    hardware: "Volcengine team_10, 1 x RTX 4090D (not A800)"
    global_batch: 512
    layout: {nodes: 1, gpus_per_node: 1, per_gpu_batch: 512}
    gradient_accumulation_steps: 1
    num_workers: 40
    prefetch_factor: 2
    max_steps: 16000             # user 2026-11-24
    save_steps: [2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000]
    optimizer: {name: AdamW, lr: 1.0e-4, betas: [0.95, 0.999], weight_decay: 1.0e-6}
    lr_schedule: {warmup_steps: 500, warmup: linear, schedule: "diffusers cosine", final_lr: 0.0}
    ema: {impl: "Diffusion Policy EMAModel", power: 0.75, max_decay: 0.9999, saved_weights: ema}
    precision: "bf16 autocast; polynomial fitting in fp32"
    model: {dit: {width: 512, layers: 4, heads: 8, dropout: 0.0, time_embed: 256}, vision: "ResNet18 per camera, from scratch, GroupNorm, same lr", basis: {family: Legendre, degree: 6, fit_pad: 1, poly_prefix: 1, poly_suffix: 1, boundary: C1}, history_noise_std: 0.5, history_reg_lambda: 0.1, consistency_weight: 1.0, inference: "1-step Euler"}
    interface_adaptation: "user 2026-11-24, model-internal, not an exception: history = interface past_actions, 8 points every 2 frames up to t-1 (67 ms at 30 Hz; paper 60 ms), first row repeated before the episode start, frame 0 starts from zero coefficients; current-frame images only (ego_view + chest 168x224) + state44, no 8-frame observation history; polynomial evaluated per 30 Hz frame, 16 rows, no velocity feed-forward"
    data: {b6v6: "HF b6-pedal-bin @ad2f5bf0, first 500 episodes (0-499), 305,667 frames"}
    inloop_mse: "evaluation/baselines/inloop.py -> eval-action-mse hb_inloop_core (copy of HumanWAM bai ff5bf95): every 250 steps, train10, batch 8, seed 1234, EMA weights; <run>/logs/inloop-mse.jsonl"
    run_dir: "team_10 /root/hb_flash/runs/b6v6-b512-s16000"
    hf_upload: "to be decided by the user after training"
    act: {global_batch: 512, max_steps: 4000, lr: 1.0e-4, betas: [0.95, 0.999], weight_decay: 1.0e-6, warmup_steps: 200, lr_schedule: cosine, ema: 0.9999, amp: true}

tasks:                            # newest data per task (HF org humanoid-benchmark, private datasets)
  a3v4:     {robot: g1, data_commit: 6393d4a}
  a7v4:     {robot: g1, data_commit: 90cc2b5}
  a10v3:    {robot: g1, data_commit: 6e410c5}
  basketv2: {robot: g1, hf: a20-basket-transfer-pre-reach-trim-expert-v2, data_commit: c4df4d4, episodes: 100}
  b1:       {robot: g1, hf: b1-riceball-microwave-expert-v1, data_commit: 36da298, episodes: 115}
  b5:       {robot: g1, hf: b5-chair-push-expert-v1, data_commit: b85b7e9, episodes: 100}
  b5ss:     {robot: g1, hf: A22-chair-push-standing-start-expert-v1-formerly-b5, data_commit: 913f5a1, episodes: 100}
  b6v6:     {robot: g1, hf: b6-pedal-bin, data_commit: ad2f5bf0, episodes: 500, episodes_note: "first 500 of 542; GR00T/Psi-Zero pure-v6 (b6v6p) use all 542"}
  b7t:      {robot: g1, hf: b7-black-clothes-hamper, data_commit: 949da46, episodes: 100, episodes_note: "first 100 of 107"}
  b7gt:     {robot: g1, hf: b7-green-clothes-hamper, data_commit: 22e3b83, episodes: 421}
  b8:       {robot: g1, hf: b8-table-wipe-expert-v1, data_commit: 3b2e618}
  c6:       {robot: g1, hf: c6-bathroom-door-fetch-expert-v1, data_commit: 3afba69, long_task: true}
  a14cr3:   {robot: h2p, hf: a14-screw-bulb, data_commit: 79fe08a, action_dim: 82}
  a17cr2:   {robot: h2, hf: a17-unscrew-bottle, data_commit: 3520b70f, episodes: 100}
  a18cr2:   {robot: h2, hf: a18-pour-water, data_commit: 44cdd571, episodes: 100}

