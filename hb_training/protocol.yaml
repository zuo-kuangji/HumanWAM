  - {model: groot, task: c6, what: "layout 4 nodes x 8 GPUs x 8 per GPU with grad-accum 2 (2026-11-13 recipe; standard 2 x 8 x 32, no accumulation), 8000 steps", decision: "user 2026-11-14: not retrained; user 2026-11-24: layout also registered as an exception"}
  - {model: groot, task: "basket v1, b7 v1, b7green v1", what: "4 x 8 x grad-accum 2 (groot-runs-ft512)", decision: "superseded by newer data versions"}
  - {model: "groot, psi0", task: basketv2, what: "published versions are 2000-step continuations from v1", decision: "user 2026-11-23: pure v2 retrain basketv2p -> b512-trimv2-pure"}
  - {model: psi0, task: c6, what: "4000 steps, not doubled", decision: "user 2026-11-13"}
  - {model: psi0, task: "a10v3, b1, b8, c6", what: "layout 4 nodes x 8 GPUs x 16 per GPU (global 512, no accumulation; standard 2 x 8 x 32)", decision: "user 2026-11-24: registered as an exception, not retrained"}
  - {model: psi0, task: "a14cr3 (cropped-v3-b512), older a17/a18", what: "proprio delay 0.15", decision: "user 2026-11-22: removed; retrained a14cr3a / b512-2cam-cropped-v2"}
  - {model: "pi05, psi0, act", task: "runs before 2026-11-12", what: "15 % proprio delay + 15 % history drop", decision: "kept, appendix"}
  - {model: "fastwam, deltaflow", task: b6v6, what: "first 500 episodes", decision: "user 2026-11-18"}
  - {model: "groot, psi0", task: b6v6p, what: "all 542 episodes", decision: "user 2026-11-23"}
  - {model: deltaflow, task: a17cr2lg, what: "legacy a18 e40 recipe (old aug, no proprio aug)", decision: "user 2026-11-22: Delta Flow later"}
  - {model: deltaflow, task: b6v6, what: "weights-only continuation from v5 step_010200, lr 3e-5", decision: "2026-11-15 plan"}
  - {model: fastwam, task: b5ss, what: "not trained", decision: user}
  - {model: act, task: "b7 black trimmed (collaborator baseline)", what: "256 x 8000 steps", decision: "collaborator run"}
  - {model: "psi0, act", task: all, what: "seed 292285 (upstream Psi0) while the other models use 42", decision: "pending user decision on a single global seed"}
  - {model: "hb_baselines (act b512*, fm_dit, dp)", task: all, what: "seed 0 (collaborator stack, config.json training.seed)", decision: "recorded 2026-11-24; pending the same user decision"}
  - {model: "groot, psi0, fastwam", task: all, what: "runs started before 2026-11-23 13:05 UTC: visual-augmentation RNG drawn from pid/urandom/time, not from the seed -> not bit-reproducible", decision: "user 2026-11-23: fixed for later runs; old results kept, appendix"}
  - {model: "groot, psi0, fastwam", task: "runs before 2026-11-15 (e.g. groot c6, psi0 c6) and unregistered task keys (groot a14cr3, fastwam b7gt + b7gt-cont2k, fastwam a14cr3; psi0 a14cr3 has 1 point)", what: "no in-training MSE curve", decision: "post-hoc open-loop MSE only; not allowed for new runs (user 2026-11-22)"}
